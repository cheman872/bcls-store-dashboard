<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCLS Store Directory Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e}
.header{background:linear-gradient(135deg,#1a237e,#0d47a1);color:#fff;padding:20px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header h1{font-size:1.4rem;font-weight:600}
.header .subtitle{opacity:.8;font-size:.85rem}
.search-bar{display:flex;align-items:center;background:rgba(255,255,255,.15);border-radius:8px;padding:6px 14px;gap:8px;min-width:300px}
.search-bar input{background:none;border:none;color:#fff;font-size:.95rem;width:100%;outline:none}
.search-bar input::placeholder{color:rgba(255,255,255,.6)}
.search-icon{font-size:1.1rem}
.container{max-width:1400px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:10px 20px;background:#fff;border:none;border-radius:8px 8px 0 0;cursor:pointer;font-size:.9rem;font-weight:500;color:#555;transition:all .2s}
.tab.active{background:#1a237e;color:#fff}
.tab:hover:not(.active){background:#e3e6f0}
.panel{display:none;background:#fff;border-radius:0 8px 8px 8px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
.panel.active{display:block}
.filters{display:flex;gap:10px;padding:16px 20px;flex-wrap:wrap;border-bottom:1px solid #eee;align-items:center}
.filter-group{display:flex;flex-direction:column;gap:3px}
.filter-group label{font-size:.7rem;text-transform:uppercase;color:#888;font-weight:600;letter-spacing:.5px}
.filter-group select{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:.85rem;background:#fff;min-width:140px}
.stats{display:flex;gap:16px;padding:12px 20px;background:#f8f9fc;border-bottom:1px solid #eee;font-size:.85rem;color:#555;flex-wrap:wrap}
.stat{font-weight:600;color:#1a237e}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead{background:#f8f9fc;position:sticky;top:0;z-index:1}
th{text-align:left;padding:12px 14px;font-weight:600;color:#444;border-bottom:2px solid #e0e0e0;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:#1a237e}
th .sort-arrow{margin-left:4px;opacity:.3;font-size:.7rem}
th.sorted .sort-arrow{opacity:1;color:#1a237e}
td{padding:10px 14px;border-bottom:1px solid #f0f0f0}
tr:hover{background:#f5f7ff}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-a{background:#e8f5e9;color:#2e7d32}
.badge-b{background:#e3f2fd;color:#1565c0}
.badge-c{background:#fff3e0;color:#e65100}
.badge-sig{background:#fce4ec;color:#c62828}
.contact-card{display:inline-flex;flex-direction:column;background:#f8f9fc;border:1px solid #e8e8e8;border-radius:8px;padding:14px 18px;margin:8px;min-width:260px}
.contact-card .card-name{font-weight:600;font-size:1rem;color:#1a237e;margin-bottom:4px}
.contact-card .card-role{font-size:.8rem;color:#888;margin-bottom:8px}
.contact-card .card-detail{font-size:.85rem;color:#444;margin:2px 0}
.contact-grid{display:flex;flex-wrap:wrap;padding:20px}
.detail-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.detail-modal.show{display:flex}
.detail-content{background:#fff;border-radius:12px;padding:30px;max-width:520px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
.detail-content h2{color:#1a237e;margin-bottom:16px;font-size:1.2rem}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0}
.detail-row .label{color:#888;font-size:.85rem}
.detail-row .value{font-weight:500;font-size:.85rem;text-align:right}
.close-btn{position:absolute;top:12px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#999}
.close-btn:hover{color:#333}
.no-results{padding:40px;text-align:center;color:#999;font-size:1rem}
.table-wrap{max-height:65vh;overflow-y:auto}
#mapContainer{height:70vh;width:100%}
.map-legend{position:absolute;bottom:30px;right:10px;background:#fff;padding:14px 18px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:500;font-size:.85rem;line-height:1.8}
.map-legend h4{margin-bottom:6px;color:#1a237e;font-size:.9rem}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.2)}
.map-filters{display:flex;gap:10px;padding:12px 20px;border-bottom:1px solid #eee;align-items:center;flex-wrap:wrap}
.map-filters label{font-size:.8rem;font-weight:600;color:#555}
.map-filters select{padding:5px 8px;border:1px solid #ddd;border-radius:5px;font-size:.85rem}
@media(max-width:768px){
  .header{padding:14px}
  .header h1{font-size:1.1rem}
  .search-bar{min-width:200px;width:100%}
  .filters,.map-filters{gap:6px}
  .filter-group select,.map-filters select{min-width:110px;font-size:.8rem}
  table{font-size:.78rem}
  td,th{padding:8px 6px}
  #mapContainer{height:55vh}
}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>BCLS CLP Store Directory</h1>
    <div class="subtitle">Region Breakdown & Investigator Assignments - August 2025</div>
  </div>
  <div class="search-bar">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="globalSearch" placeholder="Search store #, name, city, investigator..." autofocus>
  </div>
</div>
<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('stores')">Store Directory</button>
    <button class="tab" onclick="switchTab('map')">Map View</button>
    <button class="tab" onclick="switchTab('rms')">Regional Managers</button>
    <button class="tab" onclick="switchTab('investigators')">CLP Investigators</button>
  </div>

  <div id="stores-panel" class="panel active">
    <div class="filters">
      <div class="filter-group"><label>Geo Region</label><select id="fGeo"><option value="">All</option></select></div>
      <div class="filter-group"><label>BCLS Region</label><select id="fBcls"><option value="">All</option></select></div>
      <div class="filter-group"><label>CLP Region</label><select id="fClp"><option value="">All</option></select></div>
      <div class="filter-group"><label>Class</label><select id="fClass"><option value="">All</option></select></div>
      <div class="filter-group"><label>Investigator</label><select id="fInv"><option value="">All</option></select></div>
    </div>
    <div class="stats" id="statsBar">Showing <span class="stat" id="countShown">0</span> of <span class="stat" id="countTotal">0</span> stores</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th data-col="store_num" class="sorted">Store # <span class="sort-arrow">&#9650;</span></th>
          <th data-col="name">Name <span class="sort-arrow">&#9650;</span></th>
          <th data-col="class">Class <span class="sort-arrow">&#9650;</span></th>
          <th data-col="city">City <span class="sort-arrow">&#9650;</span></th>
          <th data-col="bcls_region">BCLS Region <span class="sort-arrow">&#9650;</span></th>
          <th data-col="bcls_regional_mgr">Regional Mgr <span class="sort-arrow">&#9650;</span></th>
          <th data-col="clp_region">CLP Region <span class="sort-arrow">&#9650;</span></th>
          <th data-col="investigator">Investigator <span class="sort-arrow">&#9650;</span></th>
          <th data-col="geo_region">Geo Region <span class="sort-arrow">&#9650;</span></th>
        </tr></thead>
        <tbody id="storeBody"></tbody>
      </table>
      <div class="no-results" id="noResults" style="display:none">No stores match your filters.</div>
    </div>
  </div>

  <div id="map-panel" class="panel">
    <div class="map-filters">
      <label>Filter by Investigator:</label>
      <select id="mapInvFilter"><option value="">All Investigators</option></select>
      <label style="margin-left:12px">Filter by BCLS Region:</label>
      <select id="mapRegFilter"><option value="">All Regions</option></select>
    </div>
    <div style="position:relative">
      <div id="mapContainer"></div>
      <div class="map-legend" id="mapLegend"></div>
    </div>
  </div>

  <div id="rms-panel" class="panel">
    <div class="contact-grid" id="rmsGrid"></div>
  </div>

  <div id="investigators-panel" class="panel">
    <div class="contact-grid" id="invGrid"></div>
  </div>
</div>

<div class="detail-modal" id="detailModal">
  <div class="detail-content">
    <button class="close-btn" onclick="closeDetail()">&times;</button>
    <h2 id="detailTitle"></h2>
    <div id="detailBody"></div>
  </div>
</div>

const invColors={
  "Jim Chamberlain":"#e74c3c",
  "Richard Kim":"#2980b9",
  "Rick Stewart":"#27ae60",
  "Dave Toor":"#f39c12",
  "Stephanie Radic":"#8e44ad",
  "Vacant":"#95a5a6"
};

let sortCol="store_num",sortAsc=true;
let filtered=[...stores];
let map=null, markers=[];

function init(){
  populateFilter("fGeo","geo_region");
  populateFilter("fBcls","bcls_region");
  populateFilter("fClp","clp_region");
  populateFilter("fClass","class");
  populateFilter("fInv","investigator");
  populateMapFilters();
  document.getElementById("countTotal").textContent=stores.length;
  renderStores();
  renderRMs();
  renderInvestigators();
  buildLegend();
  document.getElementById("globalSearch").addEventListener("input",renderStores);
  document.querySelectorAll(".filters select").forEach(s=>s.addEventListener("change",renderStores));
  document.getElementById("mapInvFilter").addEventListener("change",renderMap);
  document.getElementById("mapRegFilter").addEventListener("change",renderMap);
  document.querySelectorAll("th[data-col]").forEach(th=>th.addEventListener("click",()=>{
    const col=th.dataset.col;
    if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true}
    document.querySelectorAll("th").forEach(t=>t.classList.remove("sorted"));
    th.classList.add("sorted");
    th.querySelector(".sort-arrow").innerHTML=sortAsc?"&#9650;":"&#9660;";
    renderStores();
  }));
  document.getElementById("detailModal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeDetail()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});
}

function populateFilter(id,key){
  const sel=document.getElementById(id);
  const vals=[...new Set(stores.map(s=>s[key]))].sort((a,b)=>{
    const na=parseInt(a),nb=parseInt(b);
    if(!isNaN(na)&&!isNaN(nb))return na-nb;
    return a.localeCompare(b);
  });
  vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)});
}

function populateMapFilters(){
  const invSel=document.getElementById("mapInvFilter");
  const invs=[...new Set(stores.map(s=>s.investigator))].sort();
  invs.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;invSel.appendChild(o)});
  const regSel=document.getElementById("mapRegFilter");
  const regs=[...new Set(stores.map(s=>s.bcls_region))].sort((a,b)=>parseInt(a)-parseInt(b));
  regs.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent="Region "+v;regSel.appendChild(o)});
}

function renderStores(){
  const q=document.getElementById("globalSearch").value.toLowerCase();
  const fGeo=document.getElementById("fGeo").value;
  const fBcls=document.getElementById("fBcls").value;
  const fClp=document.getElementById("fClp").value;
  const fClass=document.getElementById("fClass").value;
  const fInv=document.getElementById("fInv").value;

  filtered=stores.filter(s=>{
    if(fGeo&&s.geo_region!==fGeo)return false;
    if(fBcls&&s.bcls_region!==fBcls)return false;
    if(fClp&&s.clp_region!==fClp)return false;
    if(fClass&&s["class"]!==fClass)return false;
    if(fInv&&s.investigator!==fInv)return false;
    if(q){
      const hay=(s.store_num+" "+s.name+" "+s.city+" "+s.investigator+" "+s.bcls_regional_mgr+" "+s.geo_region).toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });

  filtered.sort((a,b)=>{
    let va=a[sortCol],vb=b[sortCol];
    const na=parseInt(va),nb=parseInt(vb);
    if(!isNaN(na)&&!isNaN(nb))return sortAsc?na-nb:nb-na;
    return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
  });

  const tbody=document.getElementById("storeBody");
  tbody.innerHTML=filtered.map(s=>`<tr onclick="showDetail(${JSON.stringify(JSON.stringify(s))})" style="cursor:pointer">
    <td><strong>${s.store_num}</strong></td>
    <td>${s.name}</td>
    <td>${classBadge(s["class"])}</td>
    <td>${s.city}</td>
    <td>${s.bcls_region}</td>
    <td>${s.bcls_regional_mgr}</td>
    <td>${s.clp_region}</td>
    <td>${s.investigator}</td>
    <td>${s.geo_region}</td>
  </tr>`).join("");

  document.getElementById("countShown").textContent=filtered.length;
  document.getElementById("noResults").style.display=filtered.length?"none":"block";
}

function classBadge(c){
  if(c.includes("SIG"))return`<span class="badge badge-sig">${c}</span>`;
  if(c==="A")return`<span class="badge badge-a">${c}</span>`;
  if(c==="B")return`<span class="badge badge-b">${c}</span>`;
  return`<span class="badge badge-c">${c}</span>`;
}

function showDetail(json){
  const s=JSON.parse(json);
  document.getElementById("detailTitle").textContent="Store #"+s.store_num+" - "+s.name;
  const rm=rms.find(r=>r.region_num===s.bcls_region);
  const inv=investigators.find(i=>"CLP "+i.clp_region===s.clp_region||i.clp_region===s.clp_region.replace("CLP ",""));
  let h="";
  const rows=[
    ["Store Number",s.store_num],["Store Name",s.name],["Class",s["class"]],["City",s.city],
    ["Geographical Region",s.geo_region],["BCLS Region",s.bcls_region],
    ["Regional Manager",s.bcls_regional_mgr+(rm?" | "+rm.phone:"")],
    ["CLP Region",s.clp_region],["Investigator",s.investigator+(inv?" | "+inv.phone:"")],
  ];
  if(rm&&rm.email&&rm.email!=="nan")rows.push(["RM Email",rm.email]);
  if(inv&&inv.email&&inv.email!=="nan")rows.push(["Investigator Email",inv.email]);
  rows.forEach(r=>h+=`<div class="detail-row"><span class="label">${r[0]}</span><span class="value">${r[1]}</span></div>`);
  document.getElementById("detailBody").innerHTML=h;
  document.getElementById("detailModal").classList.add("show");
}

function closeDetail(){document.getElementById("detailModal").classList.remove("show")}

function initMap(){
  if(map)return;
  map=L.map("mapContainer").setView([53.5,-125],5);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:'&copy; OpenStreetMap contributors',maxZoom:18
  }).addTo(map);
  renderMap();
}

function renderMap(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  const fInv=document.getElementById("mapInvFilter").value;
  const fReg=document.getElementById("mapRegFilter").value;
  const filtered=stores.filter(s=>{
    if(fInv&&s.investigator!==fInv)return false;
    if(fReg&&s.bcls_region!==fReg)return false;
    return true;
  });
  filtered.forEach(s=>{
    const c=cityCoords[s.city];
    if(!c)return;
    const color=invColors[s.investigator]||"#7f8c8d";
    const icon=L.divIcon({
      className:"",
      html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,
      iconSize:[14,14],iconAnchor:[7,7]
    });
    const m=L.marker([c[0]+(.001*Math.random()-.0005),c[1]+(.001*Math.random()-.0005)],{icon})
      .bindPopup(`<div style="font-family:Segoe UI,Arial;min-width:180px">
        <strong style="color:#1a237e;font-size:1rem">Store #${s.store_num}</strong><br>
        <strong>${s.name}</strong> (${s.city})<br>
        <hr style="margin:6px 0;border:none;border-top:1px solid #eee">
        <span style="color:#555">Class:</span> ${s["class"]}<br>
        <span style="color:#555">BCLS Region:</span> ${s.bcls_region} (${s.bcls_regional_mgr})<br>
        <span style="color:#555">CLP:</span> ${s.clp_region}<br>
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};margin-right:4px"></span>
        <strong>${s.investigator}</strong><br>
        <span style="color:#555">Geo:</span> ${s.geo_region}
      </div>`,{maxWidth:280})
      .addTo(map);
    markers.push(m);
  });
}

function buildLegend(){
  let h="<h4>Investigators</h4>";
  Object.entries(invColors).forEach(([name,color])=>{
    if(name==="Vacant")return;
    h+=`<div class="legend-item"><div class="legend-dot" style="background:${color}"></div>${name}</div>`;
  });
  document.getElementById("mapLegend").innerHTML=h;
}

function renderRMs(){
  document.getElementById("rmsGrid").innerHTML=rms.map(r=>`<div class="contact-card">
    <div class="card-name">${r.regional_manager}</div>
    <div class="card-role">BCLS Region ${r.region_num}</div>
    <div class="card-detail">&#128222; ${r.phone}</div>
    <div class="card-detail">&#9993; ${r.email}</div>
  </div>`).join("");
}

function renderInvestigators(){
  document.getElementById("invGrid").innerHTML=investigators.map(r=>`<div class="contact-card">
    <div class="card-name">${r.investigator}</div>
    <div class="card-role">CLP Region ${r.clp_region}</div>
    <div class="card-detail">${r.phone&&r.phone!=="nan"?"&#128222; "+r.phone:""}</div>
    <div class="card-detail">${r.email&&r.email!=="nan"?"&#9993; "+r.email:""}</div>
  </div>`).join("");
}

function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.querySelector(`.tab[onclick*="${name}"]`).classList.add("active");
  document.getElementById(name+"-panel").classList.add("active");
  if(name==="map"){setTimeout(()=>{initMap();map.invalidateSize()},100)}
}

init();
</script>
